name: bj-burgers-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bj_burgers_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${TEST_POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bj_burgers_test']
      interval: 5s
      timeout: 5s
      retries: 10
