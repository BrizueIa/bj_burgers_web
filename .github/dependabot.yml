version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Las actualizaciones rutinarias se preparan en PRs revisados junto con la compatibilidad de Expo.
    # Este límite no bloquea los PRs de actualizaciones de seguridad de Dependabot.
    open-pull-requests-limit: 0
    groups:
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
