name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bj_burgers_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bj_burgers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bj_burgers_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bj_burgers_test
      WEB_ORIGINS: http://127.0.0.1:5173,http://127.0.0.1:4322
      PUBLIC_APP_ORIGIN: http://127.0.0.1:4322
      CODE_HMAC_SECRET: ci-code-secret-with-at-least-32-characters
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin.test@bjburgers.local
      ADMIN_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bj/api test:postgres
      - run: pnpm check

  web-e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bj_burgers_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bj_burgers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The API intentionally does not listen while NODE_ENV=test so unit and
      # integration suites cannot accidentally leave a process behind.
      # Playwright needs the real server process while still using test-only
      # database credentials below.
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bj_burgers_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bj_burgers_test
      WEB_ORIGINS: http://127.0.0.1:5173,http://127.0.0.1:4322
      PUBLIC_APP_ORIGIN: http://127.0.0.1:4322
      CODE_HMAC_SECRET: ci-code-secret-with-at-least-32-characters
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      ADMIN_EMAIL: admin.test@bjburgers.local
      ADMIN_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
