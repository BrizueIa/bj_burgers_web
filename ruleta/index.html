<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B&J Burgers | Ruleta de Regalos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --fire: #ff6b00;
        --fire-bright: #ffaa00;
        --fire-dark: #cc4400;
        --gold: #ffd700;
        --bg: #0a0a0a;
        --bg2: #111111;
        --card: #161616;
        --line: rgba(255, 107, 0, 0.18);
        --text-soft: #b7b7b7;
        --success: #38d27a;
        --danger: #ff6666;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top,
            rgba(255, 107, 0, 0.22),
            transparent 32%
          ),
          linear-gradient(180deg, #120600 0%, #0a0a0a 40%, #050505 100%);
        color: #fff;
        font-family: "Nunito", sans-serif;
      }
      html,
      body {
        overflow-x: hidden;
        width: 100%;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        opacity: 0.35;
      }
      .page {
        position: relative;
        z-index: 1;
        max-width: 1180px;
        margin: 0 auto;
        padding: 2rem 1.2rem 4rem;
      }
      .page {
        width: 100%;
        overflow-x: hidden;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 2rem;
      }
      .back-link {
        color: var(--gold);
        text-decoration: none;
        font-family: "Oswald", sans-serif;
        letter-spacing: 0.08em;
      }
      .brand {
        font-family: "Bebas Neue", cursive;
        font-size: clamp(2.8rem, 7vw, 5rem);
        line-height: 0.9;
        letter-spacing: 0.04em;
        background: linear-gradient(
          180deg,
          #fff 0%,
          var(--gold) 45%,
          var(--fire) 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .subtitle {
        color: var(--text-soft);
        max-width: 520px;
        margin-top: 0.8rem;
        line-height: 1.55;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(320px, 1fr);
        gap: 1.5rem;
        align-items: start;
      }
      .panel {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.03),
          rgba(255, 255, 255, 0.02)
        );
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 1.5rem;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(20px);
      }
      .panel h2,
      .wheel-title {
        font-family: "Bebas Neue", cursive;
        font-size: 2.2rem;
        letter-spacing: 0.06em;
        color: var(--fire-bright);
      }
      .panel-copy,
      .wheel-copy {
        color: var(--text-soft);
        line-height: 1.55;
        margin-top: 0.5rem;
      }
      .code-form {
        display: grid;
        gap: 0.9rem;
        margin-top: 1.5rem;
      }
      .code-input {
        width: 100%;
        padding: 1rem 1.1rem;
        border-radius: 14px;
        border: 1px solid rgba(255, 170, 0, 0.25);
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font: inherit;
        font-size: 1rem;
        text-transform: uppercase;
      }
      .code-input:focus {
        outline: none;
        border-color: rgba(255, 170, 0, 0.7);
        box-shadow: 0 0 0 4px rgba(255, 170, 0, 0.12);
      }
      .action-btn {
        border: none;
        border-radius: 14px;
        cursor: pointer;
        color: #fff;
        font-family: "Oswald", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        transition:
          transform 0.2s,
          opacity 0.2s,
          box-shadow 0.2s;
        padding: 1rem 1.2rem;
        background: linear-gradient(135deg, var(--fire-dark), var(--fire));
        box-shadow: 0 14px 32px rgba(255, 107, 0, 0.26);
      }
      .action-btn:hover {
        transform: translateY(-2px);
      }
      .action-btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
        box-shadow: none;
      }
      .status-box,
      .summary-box,
      .result-box,
      .config-box {
        border-radius: 16px;
        padding: 1rem 1.1rem;
        margin-top: 1rem;
      }
      .status-box {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-soft);
        min-height: 70px;
      }
      .summary-box {
        display: none;
        background: rgba(255, 170, 0, 0.08);
        border: 1px solid rgba(255, 170, 0, 0.2);
      }
      .summary-box.visible {
        display: block;
      }
      .summary-box strong,
      .result-prize {
        color: var(--gold);
      }
      .config-box {
        background: rgba(255, 102, 102, 0.08);
        border: 1px solid rgba(255, 102, 102, 0.2);
        color: #ffd6d6;
        line-height: 1.55;
      }

      /* ── Wheel panel ── */
      .wheel-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }
      .wheel-wrap {
        position: relative;
        width: min(480px, 86vw);
        height: min(480px, 86vw);
        display: grid;
        place-items: center;
        margin-top: 0.5rem;
      }

      /* Pointer */
      .pointer {
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pointer-base {
        width: 28px;
        height: 12px;
        background: linear-gradient(135deg, #ffe44d, #cc8800);
        border-radius: 6px 6px 0 0;
        box-shadow: 0 -2px 8px #ffd70099;
      }
      .pointer-tip {
        width: 0;
        height: 0;
        border-left: 14px solid transparent;
        border-right: 14px solid transparent;
        border-top: 28px solid #ffd700;
        filter: drop-shadow(0 3px 6px #ff6300aa);
      }

      /* Canvas wheel */
      canvas#wheel {
        display: block;
        border-radius: 50%;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
        box-shadow:
          0 0 0 7px #740000,
          0 0 0 13px #ffd700,
          0 0 0 16px #5a0000,
          0 0 70px #ff000055;
      }

      /* Center hub */
      .hub {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 54px;
        height: 54px;
        background: radial-gradient(circle at 35% 35%, #fffde0, #cc8800);
        border-radius: 50%;
        border: 4px solid #fff;
        box-shadow:
          0 0 24px #ffd700cc,
          0 2px 8px rgba(0, 0, 0, 0.5);
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
      }

      /* Spin button */
      .spin-btn {
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-family: "Bebas Neue", cursive;
        font-size: 1.7rem;
        letter-spacing: 1px;
        padding: 0.9rem 3.2rem;
        background: linear-gradient(135deg, #ffe033 0%, #ff6300 100%);
        color: #1a0500;
        box-shadow:
          0 6px 0 #7a2d00,
          0 8px 25px #ff630055;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
        animation: pulse-btn 2.4s ease-in-out infinite;
      }
      @keyframes pulse-btn {
        0%,
        100% {
          box-shadow:
            0 6px 0 #7a2d00,
            0 8px 25px #ff630055;
        }
        50% {
          box-shadow:
            0 6px 0 #7a2d00,
            0 8px 35px #ff6300aa;
        }
      }
      .spin-btn:hover {
        transform: translateY(-3px);
        animation: none;
        box-shadow:
          0 9px 0 #7a2d00,
          0 12px 30px #ff630088;
      }
      .spin-btn:active {
        transform: translateY(5px);
        box-shadow: 0 1px 0 #7a2d00;
        animation: none;
      }
      .spin-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
        animation: none;
      }

      .result-box {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 1rem 1.1rem;
        color: var(--text-soft);
        line-height: 1.6;
      }
      .footnote {
        width: 100%;
        color: #8f8f8f;
        font-size: 0.9rem;
        line-height: 1.55;
        text-align: center;
      }

      /* ── Modal ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.82);
        backdrop-filter: blur(5px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .modal-overlay.visible {
        opacity: 1;
        pointer-events: all;
      }
      .modal {
        border-radius: 28px;
        padding: 2.5rem 2rem;
        max-width: 360px;
        width: 92%;
        text-align: center;
        transform: scale(0.7) translateY(40px);
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }
      .modal-overlay.visible .modal {
        transform: scale(1) translateY(0);
      }
      .modal.win {
        background: linear-gradient(145deg, #1c3a00, #0d2200);
        border: 3px solid #4caf50;
        box-shadow:
          0 0 60px #4caf5066,
          0 20px 60px rgba(0, 0, 0, 0.6);
      }
      .modal.lose {
        background: linear-gradient(145deg, #1a1a1a, #0d0d0d);
        border: 3px solid #555;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      }
      .modal.win::before {
        content: "🎊 🌟 🎉 ⭐ 🎊 🌟 🎉";
        position: absolute;
        top: 0.5rem;
        left: 0;
        right: 0;
        font-size: 1.4rem;
        letter-spacing: 4px;
        opacity: 0.6;
      }
      .modal-emoji {
        font-size: 4.5rem;
        margin-bottom: 0.6rem;
        display: block;
      }
      .modal-title {
        font-family: "Bebas Neue", cursive;
        font-size: 1.7rem;
        letter-spacing: 0.06em;
        margin-bottom: 0.5rem;
      }
      .modal.win .modal-title {
        color: #7fff44;
      }
      .modal.lose .modal-title {
        color: #aaa;
      }
      .modal-prize {
        font-size: 1.25rem;
        font-weight: 900;
        margin-bottom: 1.8rem;
        line-height: 1.3;
        font-family: "Nunito", sans-serif;
      }
      .modal.win .modal-prize {
        color: #fff;
      }
      .modal.lose .modal-prize {
        color: #666;
      }
      .modal-close {
        padding: 0.75rem 2.2rem;
        font-family: "Bebas Neue", cursive;
        font-size: 1.3rem;
        letter-spacing: 0.06em;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .modal-close:hover {
        transform: scale(1.05);
      }
      .modal.win .modal-close {
        background: linear-gradient(135deg, #7fff44, #33bb00);
        color: #0d2200;
        box-shadow: 0 4px 0 #1a6600;
      }
      .modal.lose .modal-close {
        background: #333;
        color: #aaa;
        box-shadow: 0 4px 0 #111;
      }

      .ok {
        color: var(--success);
      }
      .error {
        color: var(--danger);
      }
      code {
        background: rgba(255, 255, 255, 0.08);
        padding: 0.12rem 0.35rem;
        border-radius: 6px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          gap: 1rem;
        }
        .topbar {
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 1rem;
        }
        .subtitle {
          margin-inline: auto;
        }
        .back-link {
          align-self: flex-start;
        }
        .layout > .panel:first-child {
          order: 2;
        }
        .layout > .panel:last-child {
          order: 1;
        }
      }
      @media (max-width: 768px) {
        .page {
          padding: 1rem 0.8rem 2rem;
        }
        .panel {
          padding: 1rem;
          border-radius: 18px;
        }
        .brand {
          font-size: clamp(2.2rem, 12vw, 3.5rem);
          line-height: 1;
        }
        .subtitle {
          font-size: 0.95rem;
          max-width: 100%;
        }
        .panel h2,
        .wheel-title {
          font-size: 1.7rem;
          text-align: center;
        }
        .wheel-panel {
          padding: 1rem;
          gap: 1rem;
        }
        .wheel-wrap {
          width: min(82vw, 360px, 58vh);
          height: min(82vw, 360px, 58vh);
          margin-inline: auto;
        }
        canvas#wheel {
          width: 100% !important;
          height: 100% !important;
        }
        .pointer {
          top: -2px;
        }
        .pointer-base {
          width: 22px;
          height: 9px;
        }
        .pointer-tip {
          border-left: 11px solid transparent;
          border-right: 11px solid transparent;
          border-top: 22px solid #ffd700;
        }
        .hub {
          width: 42px;
          height: 42px;
          font-size: 1.1rem;
          border-width: 3px;
        }
        .spin-btn,
        .action-btn {
          width: 100%;
          padding: 0.9rem 1rem;
          font-size: 1rem;
        }
        .spin-btn {
          font-size: 1.35rem;
          padding: 0.85rem 1rem;
        }
        .code-input {
          font-size: 16px;
          padding: 0.9rem 1rem;
        }
        .result-box,
        .status-box,
        .summary-box,
        .config-box {
          font-size: 0.92rem;
          padding: 0.85rem;
        }
        .footnote {
          font-size: 0.8rem;
        }
        .modal {
          padding: 1.8rem 1.2rem;
          max-width: 300px;
          border-radius: 22px;
        }
        .modal-emoji {
          font-size: 3.2rem;
        }
        .modal-title {
          font-size: 1.4rem;
        }
        .modal-prize {
          font-size: 1rem;
        }
        .modal-close {
          width: 100%;
          padding: 0.8rem 1rem;
          font-size: 1.1rem;
        }
      }
      @media (max-width: 420px) {
        .wheel-wrap {
          width: min(78vw, 310px, 52vh);
          height: min(78vw, 310px, 52vh);
        }
        .brand {
          font-size: 2rem;
        }
        .spin-btn {
          font-size: 1.15rem;
        }
      }
      @media (max-width: 720px) {
        .layout {
          gap: 1.1rem;
        }
        .layout > .panel:first-child {
          order: 2;
          padding: 1rem 1rem 1.2rem;
        }
        .layout > .panel:last-child {
          order: 1;
        }
        .panel h2 {
          font-size: 1.7rem;
        }
        .code-form {
          gap: 0.6rem;
          margin-top: 1rem;
        }
        .code-input {
          padding: 0.85rem 0.95rem;
          font-size: 0.95rem;
        }
        .action-btn {
          padding: 0.85rem 1rem;
          font-size: 0.95rem;
        }
        .status-box,
        .summary-box,
        .config-box {
          padding: 0.85rem 0.95rem;
        }
        .wheel-panel {
          padding: 1.2rem 1rem 1.5rem;
        }
        .wheel-title {
          font-size: 2rem;
        }
        .wheel-wrap {
          width: min(86vw, 420px);
          height: min(86vw, 420px);
        }
        .spin-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <a class="back-link" href="../">VOLVER AL MENU</a>
        <div>
          <div class="brand">RULETA B&J BURGERS</div>
        </div>
      </div>

      <div class="layout">
        <!-- ── Código panel (sin cambios) ── -->
        <section class="panel">
          <h2>Tu codigo</h2>
          <p class="panel-copy"></p>
          <form class="code-form" id="code-form">
            <input
              class="code-input"
              id="code-input"
              type="text"
              name="code"
              placeholder="Codigo"
              autocomplete="off"
              required
            />
            <button class="action-btn" id="validate-btn" type="submit">
              VALIDAR
            </button>
          </form>
          <div class="summary-box" id="summary-box"></div>
        </section>

        <!-- ── Ruleta panel ── -->
        <section class="panel wheel-panel">
          <div>
            <div class="wheel-title">Ruleta</div>
            <p class="wheel-copy"></p>
          </div>

          <!-- Canvas wheel replaces old div#wheel -->
          <div class="wheel-wrap">
            <div class="pointer">
              <div class="pointer-base"></div>
              <div class="pointer-tip"></div>
            </div>
            <canvas id="wheel"></canvas>
            <div class="hub">⭐</div>
          </div>
          <space></space>
          <button class="spin-btn" id="spin-btn" type="button" disabled>
            GIRAR RULETA
          </button>

          <div class="result-box" id="result-box">
            <strong>Premio</strong> — Aqui veras el resultado.
          </div>

          <p class="footnote">Premios sujetos a disponibilidad.</p>
        </section>
      </div>
    </div>

    <!-- ── Result modal ── -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal">
        <span class="modal-emoji" id="mEmoji"></span>
        <div class="modal-title" id="mTitle"></div>
        <div class="modal-prize" id="mPrize"></div>
        <button class="modal-close" onclick="closeModal()">¡Entendido!</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        {

        {

        },
        {
          label: "🍟FREE",
          prize: 7,
          color: "#8e24aa",
          border: "#c56be2",
          text: "#fff",
        },
        {
          label: "😢",
          prize: 0,
          color: "#2a2a2a",
          border: "#555",
          text: "#aaa",
        },
        {
          label: "🎁",
          prize: 4,
          color: "#3d8eff",
          border: "#7ab3ff",
          text: "#fff",
        },
        {
          label: "15%",
          prize: 2,
          color: "#22aa55",
          border: "#53d985",
          text: "#fff",
        },
        {
          label: "⭐",
          prize: "special",
          color: "#8b0000",
          border: "#ffd700",
          text: "#ffffff",
        },
        {
          label: "😢",
          prize: 0,
          color: "#2a2a2a",
          border: "#555",
          text: "#aaa",
        },
        {
          label: "10%",
          prize: 1,
          color: "#ff6b00",
          border: "#ff9b42",
          text: "#fff",
        },
      ];

      /* Mapeo PRIZES[idx] → índice(s) en SEG */
      const PRIZE_TO_SEG = [
        [0, 2, 4, 6, 8], // PRIZES[0]  Sigue participando  (5 bloques SP)
        [1], // PRIZES[1]  10% desc.
        [5], // PRIZES[2]  15% desc.
        [3], // PRIZES[3]  Papas gratis (porción)
        [7], // PRIZES[4]  1 extra
        [9], // PRIZES[5]  Refresco 50%
        [10], // PRIZES[6]  Papas 50%
        [11], // PRIZES[7]  Papas gratis
        [12], // PRIZES[8]  20% desc.
        [13], // PRIZES[9]  Hot dog
        [14], // PRIZES[10] Hamburguesa
      ];

      const SEG_TOTAL = SEG.reduce((s, x) => s + x.prob, 0); // 100

      /* ════════════════════════════════════════════════
         ESTADO & REFERENCIAS — sin cambios en Supabase
      ════════════════════════════════════════════════ */
      const state = { codeRecord: null, isSpinning: false };

      const refs = {
        codeForm: document.getElementById("code-form"),
        codeInput: document.getElementById("code-input"),
        validateBtn: document.getElementById("validate-btn"),
        statusBox: document.getElementById("status-box"),
        summaryBox: document.getElementById("summary-box"),
        configBox: document.getElementById("config-box"),
        wheel: document.getElementById("wheel"), // ahora canvas
        spinBtn: document.getElementById("spin-btn"),
        resultBox: document.getElementById("result-box"),
      };

      const supabaseReady = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);
      const supabaseClient = supabaseReady
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

      /* ════════════════════════════════════════════════
         SONIDOS (Web Audio API)
      ════════════════════════════════════════════════ */
      let audioCtx;
      function getAudioCtx() {
        if (!window.AudioContext && !window.webkitAudioContext) return null;
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      let spinTickTimer = null;
      let spinTickStopper = null;

      function playSpinTick(ctx, tone) {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(tone, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.3, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      function startSpinSound() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        stopSpinSound();

        let rateMs = 70;
        let tone = 720;
        spinTickTimer = setInterval(() => {
          playSpinTick(ctx, tone);
          rateMs = Math.min(220, rateMs + 6);
          tone = Math.max(320, tone - 10);
        }, rateMs);

        spinTickStopper = setTimeout(() => {
          stopSpinSound();
        }, 5200);
      }

      function stopSpinSound() {
        if (spinTickTimer) {
          clearInterval(spinTickTimer);
          spinTickTimer = null;
        }
        if (spinTickStopper) {
          clearTimeout(spinTickStopper);
          spinTickStopper = null;
        }
      }

      function playWinSound() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.85, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        gain.connect(ctx.destination);

        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const osc3 = ctx.createOscillator();
        osc1.type = "sine";
        osc2.type = "sine";
        osc3.type = "triangle";
        osc1.frequency.setValueAtTime(660, now);
        osc1.frequency.exponentialRampToValueAtTime(990, now + 0.25);
        osc2.frequency.setValueAtTime(880, now + 0.12);
        osc2.frequency.exponentialRampToValueAtTime(1320, now + 0.45);
        osc3.frequency.setValueAtTime(523.25, now);
        osc3.frequency.exponentialRampToValueAtTime(784, now + 0.6);

        osc1.connect(gain);
        osc2.connect(gain);
        osc3.connect(gain);
        osc1.start(now);
        osc1.stop(now + 0.7);
        osc2.start(now + 0.08);
        osc2.stop(now + 0.9);
        osc3.start(now + 0.18);
        osc3.stop(now + 1.1);
      }

      function playLoseSound() {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.5, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        gain.connect(ctx.destination);

        const osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.6);
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.8);
      }

      /* ════════════════════════════════════════════════
         CANVAS — dibujo de ruleta
      ════════════════════════════════════════════════ */
      let curRot = 0; // rotación acumulada (radianes)
      const ctx = refs.wheel.getContext("2d");

      function initWheel() {
        const cssSize = Math.min(
          480,
          window.innerWidth * 0.82,
          window.innerHeight * 0.52,
        );

        const dpr = window.devicePixelRatio || 1;

        /* tamaño visual */
        refs.wheel.style.width = cssSize + "px";
        refs.wheel.style.height = cssSize + "px";

        /* tamaño real interno (más resolución) */
        refs.wheel.width = cssSize * dpr;
        refs.wheel.height = cssSize * dpr;

        /* reset transform antes de escalar */
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        drawWheel(curRot);
      }

      function drawWheel(rot) {
        const W = parseFloat(refs.wheel.style.width);
        const H = parseFloat(refs.wheel.style.height);

        const cx = W / 2;
        const cy = H / 2;
        const R = W / 2 - 8; // menos pegado al borde

        ctx.clearRect(0, 0, W, H);

        // aro exterior dorado
        ctx.beginPath();
        ctx.arc(cx, cy, R + 6, 0, Math.PI * 2);
        ctx.fillStyle = "#FFD700";
        ctx.fill();

        // aro oscuro interno
        ctx.beginPath();
        ctx.arc(cx, cy, R + 2, 0, Math.PI * 2);
        ctx.fillStyle = "#740000";
        ctx.fill();

        let startA = rot - Math.PI / 2;
        const sweep = (2 * Math.PI) / SEG.length;

        SEG.forEach((seg) => {
          const endA = startA + sweep;
          const midA = startA + sweep / 2;

          // segmento
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, R, startA, endA);
          ctx.closePath();
          ctx.fillStyle = seg.color;
          ctx.fill();

          // borde limpio entre segmentos
          ctx.strokeStyle = "rgba(255,255,255,0.15)";
          ctx.lineWidth = 2;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.stroke();

          // texto
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(midA);

          ctx.fillStyle = seg.text;
          ctx.font = "bold 14px Nunito";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          ctx.fillText(seg.label, R * 0.68, 0);

          ctx.restore();

          startA = endA;
        });

        /* aro interior limpio */
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,215,0,0.9)";
        ctx.lineWidth = 4;
        ctx.stroke();

        // brillo suave
        const shine = ctx.createRadialGradient(
          cx - R * 0.25,
          cy - R * 0.25,
          0,
          cx,
          cy,
          R,
        );
        shine.addColorStop(0, "rgba(255,255,255,0.15)");
        shine.addColorStop(0.5, "rgba(255,255,255,0.04)");
        shine.addColorStop(1, "rgba(0,0,0,0.15)");

        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fillStyle = shine;
        ctx.fill();
      }

      /* Ángulo del centro de un segmento SEG (desde el tope, sentido horario) */
      function segMidAngle(segIdx) {
        const sweep = (2 * Math.PI) / SEG.length;
        return segIdx * sweep + sweep / 2;
      }

      /* ════════════════════════════════════════════════
         ANIMACIÓN DE GIRO  (reemplaza el antiguo spinWheel)
         prizeIdx  = índice en PRIZES[]
         onComplete = callback al terminar la animación
      ════════════════════════════════════════════════ */
      function spinWheel(prizeIdx, onComplete) {
        let possibleSegments = [];

        SEG.forEach((seg, index) => {
          if (seg.prize === prizeIdx) possibleSegments.push(index);

          if (seg.prize === "special" && (prizeIdx === 9 || prizeIdx === 10)) {
            possibleSegments.push(index);
          }
        });

        const segIdx =
          possibleSegments[Math.floor(Math.random() * possibleSegments.length)];

        const targetMid = segMidAngle(segIdx);

        const desired =
          ((-targetMid % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

        const current =
          ((curRot % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

        let delta = (desired - current + 2 * Math.PI) % (2 * Math.PI);

        const spins = (5 + Math.floor(Math.random() * 3)) * 2 * Math.PI;
        const travel = spins + delta;

        const from = curRot;
        const dur = 4500;
        const t0 = performance.now();

        function ease(t) {
          return 1 - Math.pow(1 - t, 4);
        }

        function frame(now) {
          const t = Math.min((now - t0) / dur, 1);

          curRot = from + travel * ease(t);
          drawWheel(curRot);

          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            curRot = from + travel;
            drawWheel(curRot);
            onComplete?.();
          }
        }

        requestAnimationFrame(frame);
      }

      /* ════════════════════════════════════════════════
         MODAL
      ════════════════════════════════════════════════ */
      function showModal(label, emoji, isWin) {
        const overlay = document.getElementById("modalOverlay");
        const modal = document.getElementById("modal");
        modal.className = "modal " + (isWin ? "win" : "lose");

        document.getElementById("mEmoji").textContent = emoji;
        document.getElementById("mTitle").textContent = isWin
          ? "¡FELICIDADES!"
          : "¡MEJOR SUERTE LA PROXIMA!";
        document.getElementById("mPrize").textContent = isWin
          ? label
          : "Sigue participando, ¡no te rindas!";

        overlay.classList.add("visible");
      }

      function closeModal() {
        document.getElementById("modalOverlay").classList.remove("visible");
        /* Re-habilitar controles al cerrar el modal */
        state.isSpinning = false;
        refs.validateBtn.disabled = false;
        updateSummary();
      }

      /* ════════════════════════════════════════════════
         LÓGICA SUPABASE — sin cambios
      ════════════════════════════════════════════════ */
      function setStatus(message, tone) {
        if (!refs.statusBox) return;
        refs.statusBox.className = "status-box";
        if (tone === "ok") refs.statusBox.classList.add("ok");
        if (tone === "error") refs.statusBox.classList.add("error");
        refs.statusBox.textContent = message;
      }

      function updateSummary() {
        if (!state.codeRecord) {
          refs.summaryBox.className = "summary-box";
          refs.summaryBox.innerHTML = "";
          refs.spinBtn.disabled = true;
          return;
        }
        refs.summaryBox.className = "summary-box visible";
        refs.summaryBox.innerHTML = `
          <strong>Codigo validado:</strong> ${state.codeRecord.code}<br />
          <strong>Giros disponibles:</strong> ${state.codeRecord.remaining_spins}
        `;
        refs.spinBtn.disabled =
          state.codeRecord.remaining_spins < 1 || state.isSpinning;
      }

      async function validateCode(code) {
        const { data, error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .select("id, code, remaining_spins, is_active")
          .ilike("code", code)
          .maybeSingle();
        if (error) throw error;
        return data;
      }

      async function consumeSpin() {
        const currentRemaining = Number(state.codeRecord.remaining_spins || 0);
        const { data, error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .update({ remaining_spins: currentRemaining - 1 })
          .eq("id", state.codeRecord.id)
          .eq("remaining_spins", currentRemaining)
          .gt("remaining_spins", 0)
          .select("id, code, remaining_spins, is_active")
          .maybeSingle();
        if (error) throw error;
        return data;
      }

      function buildWeightedPool() {
        return PRIZES.map((prize, index) => ({
          index,
          weight: prize.weight,
          label: prize.label,
        }));
      }

      function pickPrize() {
        const pool = buildWeightedPool();
        const total = pool.reduce((sum, item) => sum + item.weight, 0);
        let roll = Math.random() * total;
        for (const item of pool) {
          roll -= item.weight;
          if (roll <= 0) return item;
        }
        return pool[pool.length - 1];
      }

      /* ════════════════════════════════════════════════
         EVENT LISTENERS — lógica Supabase intacta;
         spinWheel ahora recibe callback en lugar de setTimeout
      ════════════════════════════════════════════════ */
      refs.codeForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!supabaseReady) {
          setStatus(
            "Falta configurar Supabase en este archivo antes de validar codigos.",
            "error",
          );
          return;
        }
        const code = refs.codeInput.value.trim().toUpperCase();
        if (!code) {
          setStatus("Ingresa un codigo valido.", "error");
          return;
        }

        refs.validateBtn.disabled = true;
        refs.spinBtn.disabled = true;
        state.codeRecord = null;
        updateSummary();
        setStatus("Consultando codigo en Supabase...", null);

        try {
          const record = await validateCode(code);
          if (!record || record.is_active === false) {
            setStatus("El codigo no existe o esta inactivo.", "error");
            return;
          }
          if (Number(record.remaining_spins || 0) < 1) {
            state.codeRecord = record;
            updateSummary();
            setStatus("Este codigo ya no tiene giros disponibles.", "error");
            return;
          }
          state.codeRecord = record;
          updateSummary();
          setStatus("Codigo valido. Ya puedes girar la ruleta.", "ok");
        } catch (error) {
          setStatus(`No se pudo validar el codigo: ${error.message}`, "error");
        } finally {
          refs.validateBtn.disabled = false;
        }
      });

      refs.spinBtn.addEventListener("click", async () => {
        if (!state.codeRecord || state.isSpinning) return;
        if (Number(state.codeRecord.remaining_spins || 0) < 1) {
          updateSummary();
          setStatus("Este codigo ya no tiene giros disponibles.", "error");
          return;
        }

        state.isSpinning = true;
        refs.spinBtn.disabled = true;
        refs.validateBtn.disabled = true;
        startSpinSound();
        setStatus("Descontando un giro y preparando la ruleta...", null);

        try {
          const updatedRecord = await consumeSpin();
          if (!updatedRecord) {
            state.isSpinning = false;
            refs.validateBtn.disabled = false;
            stopSpinSound();
            state.codeRecord = await validateCode(state.codeRecord.code);
            updateSummary();
            setStatus(
              "No fue posible consumir el giro. El codigo pudo cambiar en otra sesion.",
              "error",
            );
            return;
          }
          state.codeRecord = updatedRecord;
          updateSummary();

          const prize = pickPrize();
          setStatus("¡Girando la ruleta!", "ok");

          /* Girar canvas y mostrar resultado al terminar */
          spinWheel(prize.index, () => {
            const isWin = !prize.label
              .toLowerCase()
              .includes("sigue participando");

            if (isWin) {
              playWinSound();
            } else {
              playLoseSound();
            }
            stopSpinSound();

            refs.resultBox.innerHTML = `
              <strong>Resultado del giro</strong><br/>
              <span class="result-prize">${prize.label}</span><br />
              Te quedan <strong>${state.codeRecord.remaining_spins}</strong> giro(s) disponibles.
            `;
            setStatus(
              state.codeRecord.remaining_spins > 0
                ? "Giro aplicado correctamente. Si aun tienes saldo, puedes volver a girar."
                : "Giro aplicado correctamente. Este codigo ya quedo sin giros disponibles.",
              "ok",
            );

            showModal(prize.label, PRIZE_EMOJI[prize.index], isWin);
            /* isSpinning y botones se re-habilitan al cerrar el modal (closeModal) */
          });
        } catch (error) {
          state.isSpinning = false;
          refs.validateBtn.disabled = false;
          stopSpinSound();
          updateSummary();
          setStatus(`No se pudo consumir el giro: ${error.message}`, "error");
        }
      });

      /* ════════════════════════════════════════════════
         INICIALIZACIÓN
      ════════════════════════════════════════════════ */
      function updateConfigBox() {
        if (!refs.configBox) return;
        refs.configBox.style.display = supabaseReady ? "none" : "block";
      }

      window.addEventListener("resize", initWheel);
      initWheel();
      updateConfigBox();
    </script>
